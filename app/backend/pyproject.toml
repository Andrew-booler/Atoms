[tool.ruff]
# 后端 lint/format 门禁（P0 横切补强）。只启用低争议、可自动修复的规则，
# 不做业务逻辑重构；行长与 import 分组统一由 ruff 负责。
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "logs",
    "htmlcov",
    "alembic/versions",
    "lambda_handler.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core", "dependencies", "models", "routers", "schemas", "services", "testing", "utils"]

[tool.ruff.lint.per-file-ignores]
# Alembic env 需要在 sys.path 调整后再导入项目模块，属于框架约定。
"alembic/env.py" = ["E402", "I001"]
