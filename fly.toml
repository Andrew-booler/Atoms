# fly.toml app configuration file generated for atoms-services on 2026-11-01T08:54:45-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'atoms-services'
primary_region = 'sin'

[build]
[env]
  ENVIRONMENT = 'prod'
  MGX_IGNORE_MODULE_INIT = 'true'
  PORT = '8080'

[[mounts]]
  source = 'docker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
